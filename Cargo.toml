[package]
name = "wxy-web"
description = "wxylib in the browser: open a COG over HTTP with wxy-tiff and warp it with wxy-warp, compiled to wasm."
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wxylib/web"
authors = ["Michael Sumner <mdsumner@gmail.com>"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wxylib/core pinned by git rev; bump together.
wxy-domain = { git = "https://github.com/wxylib/core", rev = "cb17137109b1fc1be2fbeda9a430484530bdd64e" }
wxy-source = { git = "https://github.com/wxylib/core", rev = "cb17137109b1fc1be2fbeda9a430484530bdd64e" }
wxy-tiff = { git = "https://github.com/wxylib/core", rev = "cb17137109b1fc1be2fbeda9a430484530bdd64e" }
wxy-warp = { git = "https://github.com/wxylib/core", rev = "cb17137109b1fc1be2fbeda9a430484530bdd64e" }
# the same rwarp wxy-warp pins, for CRS transforms of the source outline
rwarp = { git = "https://github.com/hypertidy/rwarp", rev = "4f1ab196e3e270626e4fcc649444b9dfe87de59e", default-features = false, features = ["proj4rs"] }
# same version wxy-tiff uses, for the AsyncFileReader trait
async-tiff = { version = "0.4.0", default-features = false }
async-trait = "0.1.89"
bytes = "1.12.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "Response", "Headers"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
