[package]
name = "wxy-web"
description = "wxylib in the browser: open a COG or a Zarr over HTTP with wxy-tiff and wxy-zarr and warp it with wxy-warp, compiled to wasm."
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wxylib/web"
authors = ["Michael Sumner <mdsumner@gmail.com>"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wxylib/core pinned by git rev; bump together.
wxy-domain = { git = "https://github.com/wxylib/core", rev = "a274ef4c3620eaa0dbdeaf4d230150c564ce3b3d" }
wxy-source = { git = "https://github.com/wxylib/core", rev = "a274ef4c3620eaa0dbdeaf4d230150c564ce3b3d" }
wxy-tiff = { git = "https://github.com/wxylib/core", rev = "a274ef4c3620eaa0dbdeaf4d230150c564ce3b3d" }
wxy-warp = { git = "https://github.com/wxylib/core", rev = "a274ef4c3620eaa0dbdeaf4d230150c564ce3b3d" }
wxy-zarr = { git = "https://github.com/wxylib/core", rev = "a274ef4c3620eaa0dbdeaf4d230150c564ce3b3d" }
# the VRT model and planner, for the VRT discovery page
vrt-model = { git = "https://github.com/wxylib/core", rev = "a274ef4c3620eaa0dbdeaf4d230150c564ce3b3d" }
# the storage trait wxy-zarr opens arrays through (zarrs), for a store
# over fetch
zarrs_storage = { version = "0.4.5", features = ["async"] }
serde_json = "1"
# the same rwarp wxy-warp pins, for CRS transforms of the source outline
# and the view plan
rwarp = { version = "0.5", default-features = false, features = ["proj4rs"] }
# same version wxy-tiff uses, for the AsyncFileReader trait
async-tiff = { version = "0.4.0", default-features = false }
async-trait = "0.1.89"
bytes = "1.12.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "Response", "Headers"] }

# rwarp::view (the view-to-chunk planner) is on rwarp's main, after 0.5.0.
# Drop this once a release has it. wxy-warp follows the same patch, so
# there is one rwarp in the build.
[patch.crates-io]
rwarp = { git = "https://github.com/hypertidy/rwarp", rev = "e36a667f13f07337fbd537a7029416d7d0fd0b2e" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
